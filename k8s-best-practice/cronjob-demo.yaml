apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cron
  namespace: demo-prod
spec:
  schedule: "*/2 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cron-worker
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - echo "CronJob executed at $(date)"
